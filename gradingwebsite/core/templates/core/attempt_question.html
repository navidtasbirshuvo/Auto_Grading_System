{% extends 'base.html' %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Attempt Exam</h1>
    <p class="page-subtitle">Read the question carefully and provide your answer below.</p>
</div>

<div class="card" style="max-width: 800px;">
    <div class="card-body">
        <label style="display: block; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600;">Question</label>
        <div style="font-size: 1.25rem; font-weight: 500; color: var(--text-main); margin-bottom: 2rem; line-height: 1.6;">
            {{ question.question_text }}
        </div>
        
        <div style="border-top: 1px solid var(--border); margin-bottom: 2rem;"></div>
        
        <form method="post" action="{% url 'attempt-question' question.id %}">
            {% csrf_token %}
            <div style="margin-bottom: 1.5rem;">
                <label class="form-label" style="display: block; margin-bottom: 0.5rem; color: var(--text-main); font-weight: 500;">Your Answer</label>
                <textarea name="answer" class="form-control" rows="8" placeholder="Type your answer here..." required style="width: 100%; padding: 1rem; font-size: 1rem; font-family: 'Inter', sans-serif; line-height: 1.6;"></textarea>
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 1rem;">
                <button type="submit" class="btn btn-primary" style="justify-content: center; padding: 0.8rem;">
                    <i class="bi bi-send"></i> Submit Answer
                </button>
                <div style="color: var(--text-muted); font-size: 0.85rem; text-align: center;">
                    <i class="bi bi-info-circle"></i> Once submitted, your answer will be graded instantly. You cannot edit it afterwards.
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
